---
- name: Install tree on every OS family
  hosts: planetexpress
  gather_facts: true

  tasks:
    - name: Install tree (Debian family)
      ansible.builtin.apt:
        name: tree
        state: present
      become: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Install tree (Red Hat family)
      ansible.builtin.dnf:
        name: tree
        state: present
      become: true
      when: ansible_facts['os_family'] == "RedHat"
